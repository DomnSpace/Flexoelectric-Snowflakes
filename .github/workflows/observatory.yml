name: Snowflake Observatory CI
on:
  push:
    branches: [feat/snowflake-observatory-v2]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse UI module
        run: node --check app/observatory.js
      - name: Parse electrostatic extension
        run: node --check app/solver/electric25d.js
      - name: Check viewer DOM / solver wiring
        run: node app/tests/observatory-contract.test.mjs
      - name: Run physics regression suite
        run: node app/tests/run-all.mjs
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.56.1
      - name: Launch Observatory and run Chromium smoke test
        run: |
          python3 -m http.server 8088 > /tmp/snowflake-server.log 2>&1 &
          node app/tests/observatory-browser.test.mjs
      - name: Upload observatory screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snowflake-observatory-screenshot
          path: artifacts/snowflake-observatory.png
          if-no-files-found: ignore
