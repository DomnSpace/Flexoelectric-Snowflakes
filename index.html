<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flexoelectric Snowflake — 3D Wiggle & Accretion</title>
  <style>
    :root {
      --bg:#0c0f12; --fg:#e7eef7; --muted:#9fb3c8; --accent:#6ad3ff; --panel:#12171d;
    }
    html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px/1.2 Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #app { position:fixed; inset:0; display:grid; grid-template-columns: 1fr 360px; }
    #scene { position:relative; }
    #pane { position: absolute; top: 10px; right: 10px; }
    .topbar { position:absolute; top:10px; left:10px; display:flex; gap:8px; z-index:10; }
    .btn { background:#15202b; color:#d7e7ff; border:1px solid #1e2b38; border-radius:10px; padding:8px 12px; cursor:pointer; user-select:none; box-shadow:0 0 0 1px #0a1016 inset; }
    .btn:hover { background:#192636; }
    .hud { position:absolute; bottom:12px; left:12px; background:#0e141b99; border:1px solid #1a2530; border-radius:10px; padding:8px 12px; font-variant-numeric:tabular-nums; backdrop-filter: blur(6px); }
    canvas { display:block; }
    a { color: var(--accent); text-decoration: none; }
    .logo { position:absolute; top:10px; right:10px; opacity:.6; font-size:12px; letter-spacing:.08em; }
  </style>
</head>
<body>
<div id="app">
  <div id="scene">
    <div class="topbar">
      <div class="btn" id="play">▶ Play</div>
      <div class="btn" id="pause">⏸ Pause</div>
      <div class="btn" id="step">⏭ Step</div>
      <div class="btn" id="reset">⟲ Reset</div>
      <div class="btn" id="randomize">🎲 Randomize</div>
      <div class="btn" id="exportPNG">🖼 Export PNG</div>
    </div>
    <div class="hud" id="hud">—</div>
    <div class="logo">FlexoSnow v0.1</div>
  </div>
  <div id="pane"></div>
</div>
<!-- Three.js & helpers --><script src="https://unpkg.com/three@0.124.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
<!-- dat.GUI --><script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
/*
FlexoSnow - A 3D Flexoelectric Snowflake Simulation
---------------------------------------------------
This file contains a self-contained simulation of snowflake growth,
incorporating flexoelectric effects.

Controls:
- Mouse: Orbit the camera.
- Scroll: Zoom in and out.
- Buttons: Play/Pause, Step, Reset, Randomize, Export PNG.
- Keyboard:
  - Space: Play/Pause
  - R: Reset
  - S: Step Simulation
  - L: Toggle Camera Auto-Rotation

The control pane on the right allows for real-time adjustment of all
physical and visual parameters of the simulation.
*/
(() => {
  const TAU = Math.PI*2;
  const rand = (a=1,b=0) => b + (a-b)*Math.random();
  const clamp = (x,lo,hi)=> Math.max(lo, Math.min(hi, x));

  let frameCount = 0;
  let fps = 0;
  let lastFpsUpdate = 0;
  let lastMeanKappa = 0;
  let lastMeanDL = 0;

  const VIZ = {
    scale: 3000,
    wiggleGain: 3e5,
  };

  const params = {
    E_mag: 1500, E_theta: 45, E_phi: 10,
    mu_eff: 1e-6, S: 0.08, S0: 0.02, k0: 2e-5, alpha_E: 1e-4, alpha_P: 1e-2,
    k_plate: 6e-6, S_w: 0.012, beta_E: 0.4, beta_P: 0.6, beta_base: 0.1, platingExtent: 0.35,
    kappa_branch: 80, ds_branch: 1e-4, branchScale: 0.55,
    omega: 12, zeta: 0.12, gustSigma: 2e-8, gustTau: 0.25,
    armNodes: 24, L0: 6e-4, w0: 2.5e-5, dt: 0.016, speed: 1.0,
    autoRotate: true, grid: false, axes: false, wireframe: false, seed: 1,
  };

  const KAPPA_COEFF = 3000;
  const A_CLIP = 3e-7;
  const ADOT_CLIP = 2e-5;

  const sceneEl = document.getElementById('scene');
  const hudEl = document.getElementById('hud');
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  renderer.setClearColor(0x0c0f12, 1);
  sceneEl.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0c0f12, 2, 5);
  const camera = new THREE.PerspectiveCamera(50, sceneEl.clientWidth/sceneEl.clientHeight, 0.001, 100);
  camera.position.set(0.8, 0.7, 1.2);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const light = new THREE.HemisphereLight(0xaed6ff, 0x0c0f12, 0.9);
  scene.add(light);
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(2,2,3);
  scene.add(dir);

  const fieldArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 0.6, 0x66ccff, 0.02, 0.06);
  scene.add(fieldArrow);

  const grid = new THREE.GridHelper(4, 20, 0x1e2b38, 0x0f1821);
  grid.visible = params.grid; scene.add(grid);

  const axes = new THREE.AxesHelper(1);
  axes.visible = params.axes;
  scene.add(axes);

  const center = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, 0.02, 6),
    new THREE.MeshStandardMaterial({color:0x9fd0ff, metalness:0.2, roughness:0.4, transparent:true, opacity:0.55})
  );
  center.rotation.x = Math.PI*0.5;
  center.scale.setScalar(0.0015 * VIZ.scale);
  scene.add(center);

  const flakeGroup = new THREE.Group();
  scene.add(flakeGroup);

  const branchMarkers = new THREE.Group();
  scene.add(branchMarkers);
  const markerData = [];

  const ARM_COUNT = 6;
  const SEGMENTS = () => params.armNodes;

  const cylGeom = new THREE.CylinderGeometry(1,1,1, 10, 1, true);
  cylGeom.translate(0, 0.5, 0);

  const armMaterial = new THREE.MeshStandardMaterial({
    color:0xcfe9ff, emissive:0x001018, metalness:0.15, roughness:0.35,
    transparent:true, opacity:0.75, side:THREE.DoubleSide, vertexColors: true,
  });

  function makeArm(baseAngle){
    const nodes = new Array(SEGMENTS()+1).fill(0).map((_,i)=>({
      s: i/(SEGMENTS()), pos: new THREE.Vector3(), w: params.w0,
    }));
    return {
      baseAngle, A: 0, Adot: 0, P: 0,
      nodes, branches: [],
      inst: new THREE.InstancedMesh(cylGeom, armMaterial, SEGMENTS()),
    };
  }

  let arms = [];
  function resetArms(){
    for (const a of arms){ flakeGroup.remove(a.inst); a.inst.geometry.dispose?.(); }
    arms = [];
    for(let k=0;k<ARM_COUNT;k++){
      const a = makeArm((TAU/ARM_COUNT)*k);
      flakeGroup.add(a.inst);
      arms.push(a);
    }
  }

  function EVector(){
    const th = params.E_theta * Math.PI/180;
    const ph = params.E_phi * Math.PI/180;
    return new THREE.Vector3(Math.cos(th)*Math.cos(ph), Math.sin(th)*Math.cos(ph), Math.sin(ph)).multiplyScalar(params.E_mag);
  }

  function updateFieldArrow(){
    fieldArrow.setDirection(EVector().clone().normalize());
  }

  const seedObj = {v: 1};
  function randn(seedObj){
    let s = seedObj.v = (1664525*seedObj.v + 1013904223) >>> 0;
    const u1 = (s & 0xffff)/0x10000; s = seedObj.v = (1664525*seedObj.v + 1013904223) >>> 0;
    const u2 = (s & 0xffff)/0x10000;
    return Math.sqrt(-2*Math.log(Math.max(1e-9,u1))) * Math.cos(TAU*u2);
  }

  let running = true;
  function resetState(){
    seedObj.v = Math.max(1, params.seed|0);
    resetArms();
    for (const arm of arms){
      const L = params.L0;
      const r = new THREE.Vector3(Math.cos(arm.baseAngle), Math.sin(arm.baseAngle), 0);
      for (let i=0;i<arm.nodes.length;i++){
        arm.nodes[i].pos.copy(r.clone().multiplyScalar(i/(arm.nodes.length-1)*L));
        arm.nodes[i].w = params.w0;
      }
      arm.A = 0; arm.Adot = 0; arm.P = 0;
    }
    updateMeshes(true);
  }

  const tipCurvature = (arm) => KAPPA_COEFF * arm.A;

  function step(dt){
    const E = EVector();
    let totalDip = new THREE.Vector3();
    let meanKappa=0, meanDL=0;

    for (const arm of arms){
      const gust = params.gustSigma * Math.sqrt(2*dt/Math.max(1e-6, params.gustTau)) * randn(seedObj);
      const omega = params.omega * TAU;
      const A_ddot = gust - 2*params.zeta*omega*arm.Adot - (omega*omega)*arm.A;
      arm.Adot = clamp(arm.Adot + A_ddot*dt, -ADOT_CLIP, ADOT_CLIP);
      arm.A    = clamp(arm.A + arm.Adot*dt,  -A_CLIP,   A_CLIP);

      const kappa = tipCurvature(arm);
      const P = params.mu_eff * kappa;
      arm.P = P;

      const armDir = new THREE.Vector3(Math.cos(arm.baseAngle), Math.sin(arm.baseAngle), 0);
      totalDip.add(armDir.clone().multiplyScalar(Math.abs(P) * (60e-6*60e-6) * 0.4e-3));

      const Sstar = params.S0 + 4.5e-6*Math.abs(kappa);
      const E_local = E.dot(armDir);
      const Phi = Math.max(0, 1 + params.alpha_E*Math.abs(E_local)/1000 + params.alpha_P*Math.abs(P));
      const dL = Math.max(0, params.k0*(params.S - Sstar)) * Phi * dt * params.speed;
      meanDL += dL;
      if (dL>0) arm.nodes[arm.nodes.length-1].pos.add(armDir.clone().multiplyScalar(dL));

      for (let i=0;i<arm.nodes.length;i++){
        const s = i/(arm.nodes.length-1);
        if(s >= 1-params.platingExtent){
          const dW = Math.max(0, params.k_plate*(params.S - params.S_w)) * (params.beta_base + params.beta_E*Math.abs(E_local)/1000 + params.beta_P*Math.abs(P)) * dt * params.speed;
          arm.nodes[i].w = Math.max(params.w0*0.5, Math.min(params.w0*3.0, arm.nodes[i].w + dW));
        }
      }

      if (Math.abs(kappa) > params.kappa_branch){
        const lastNode = arm.nodes[arm.nodes.length-1];
        const lastBranchS = arm.branches.length? arm.branches[arm.branches.length-1].s0 : 0;
        if (lastNode.pos.length() - lastBranchS*params.L0 > params.ds_branch){
          const normalSign = (Math.random()<0.5)? +1 : -1;
          const bLen = params.branchScale * params.L0 * 0.25;
          arm.branches.push({
            s0: 1, normal: normalSign, length: bLen,
            nodes: [ lastNode.pos.clone(), lastNode.pos.clone().add(new THREE.Vector3(-armDir.y, armDir.x, 0).multiplyScalar(normalSign*bLen)) ]
          });
          const marker = new THREE.Mesh(new THREE.SphereGeometry(0.01, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true }));
          marker.position.copy(lastNode.pos).multiplyScalar(VIZ.scale);
          branchMarkers.add(marker);
          markerData.push({ mesh: marker, time: 0 });
        }
      }
      meanKappa += Math.abs(kappa);

      for (let i=1;i<arm.nodes.length;i++){
        const s = i/(arm.nodes.length-1);
        const baseVec = arm.nodes[i].pos.clone().sub(arm.nodes[i-1].pos);
        const segLen = baseVec.length();
        const dir = baseVec.normalize();
        const normal = new THREE.Vector3(-armDir.y, armDir.x, 0).normalize();
        const wobbleAmp = arm.A * VIZ.wiggleGain;
        const wobble = normal.clone().multiplyScalar(wobbleAmp * Math.sin(6*s*TAU + 0.7));
        arm.nodes[i].pos.copy(arm.nodes[i-1].pos.clone().add(dir.multiplyScalar(segLen)).add(wobble));
      }
    }
    const Tz = new THREE.Vector3().crossVectors(totalDip, E).z;
    flakeGroup.rotation.z += clamp((Tz/1.6e-10) * dt * 0.5, -0.01, 0.01);
    updateMeshes(false);
    lastMeanKappa = meanKappa;
    lastMeanDL = meanDL;
  }

  const tmpMat = new THREE.Matrix4(), tmpQuat = new THREE.Quaternion(), tmpScale = new THREE.Vector3();
  function updateMeshes(forceRebuild){
    for (const arm of arms){
      const count = SEGMENTS();
      if (forceRebuild && arm.inst.count !== count){
        flakeGroup.remove(arm.inst);
        arm.inst = new THREE.InstancedMesh(cylGeom, armMaterial, count);
        flakeGroup.add(arm.inst);
      }
      const P_abs = Math.abs(arm.P || 0);
      const lerpFactor = clamp(P_abs / 5e-10, 0, 1);
      const tipColor = new THREE.Color(0xcfe9ff).lerp(new THREE.Color(0xffffff), lerpFactor);
      const baseColor = new THREE.Color(0xcfe9ff);

      for (let i=0;i<count;i++){
        const p0 = arm.nodes[i].pos.clone().multiplyScalar(VIZ.scale);
        const p1 = arm.nodes[i+1].pos.clone().multiplyScalar(VIZ.scale);
        const seg = p1.clone().sub(p0);
        tmpQuat.setFromUnitVectors(new THREE.Vector3(0,1,0), seg.clone().normalize());
        const r = (arm.nodes[i].w + arm.nodes[i+1].w) * 0.25 * VIZ.scale;
        tmpMat.identity().compose(p0, tmpQuat, new THREE.Vector3(r, seg.length(), r));
        arm.inst.setMatrixAt(i, tmpMat);
        arm.inst.setColorAt(i, i>=count-3 ? tipColor : baseColor);
      }
      arm.inst.instanceMatrix.needsUpdate = true;
      arm.inst.instanceColor.needsUpdate = true;
    }
  }

  const gui = new dat.GUI({ autoPlace: false });
  const paneEl = document.getElementById('pane');
  paneEl.appendChild(gui.domElement);
  Object.assign(paneEl.firstChild.style, {position:'absolute', right:'10px', top:'10px', width:'340px'});

  const fViz = gui.addFolder('Visualization');
  fViz.add(VIZ, 'scale', 500, 10000, 100).onChange(()=>{ center.scale.setScalar(0.0015*VIZ.scale); updateMeshes(true); });
  fViz.add(VIZ, 'wiggleGain', 1e3, 1e6);
  fViz.add(params, 'axes').onChange((v)=>axes.visible=v);
  fViz.add(params, 'wireframe').onChange((v)=>armMaterial.wireframe=v);
  fViz.open();

  const fField = gui.addFolder('Field');
  fField.add(params, 'E_mag', 0, 5000, 10).onChange(updateFieldArrow);
  fField.add(params, 'E_theta', 0, 180, 1).onChange(updateFieldArrow);
  fField.add(params, 'E_phi', -90, 90, 1).onChange(updateFieldArrow);
  fField.open();

  const fFlexo = gui.addFolder('Flexo & Growth');
  fFlexo.add(params, 'mu_eff', 0, 5e-6);
  fFlexo.add(params, 'S', 0, 0.2);
  fFlexo.add(params, 'k0', 0, 1e-4);

  const fGeom = gui.addFolder('Geometry & Time');
  fGeom.add(params, 'armNodes', 6, 48, 1).onChange(resetState);
  fGeom.add(params, 'speed', 0.1, 4);
  fGeom.add(params, 'autoRotate').onChange((v)=>controls.autoRotate=v);
  fGeom.add(params, 'grid').onChange((v)=>grid.visible=v);

  document.getElementById('play').onclick = ()=> running = true;
  document.getElementById('pause').onclick = ()=> running = false;
  document.getElementById('step').onclick = ()=> { running = false; step(params.dt); render(); };
  document.getElementById('reset').onclick = ()=> resetState();
  document.getElementById('randomize').onclick = ()=> { params.seed = (1 + Math.random()*9999)|0; resetState(); };
  document.getElementById('exportPNG').onclick = ()=> { renderer.render(scene, camera); const a = document.createElement('a'); a.download = 'flexo_snowflake.png'; a.href = renderer.domElement.toDataURL('image/png'); a.click(); };

  addEventListener('resize', ()=>{ renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight); camera.aspect = sceneEl.clientWidth/sceneEl.clientHeight; camera.updateProjectionMatrix(); });
  addEventListener('keydown', (e)=>{ if (e.code === 'Space') running = !running; else if (e.code === 'KeyR') resetState(); else if (e.code === 'KeyS') { running = false; step(params.dt); render(); } else if (e.code === 'KeyL') params.autoRotate = !params.autoRotate; });

  updateFieldArrow();
  resetState();

  let tPrev = performance.now();
  function tick(){
    const tNow = performance.now();
    let dt = (tNow - tPrev)/1000;
    tPrev = tNow;
    dt = Math.min(0.05, dt);

    if (running){
      const substeps = Math.max(1, Math.floor(params.speed));
      for (let i=0;i<substeps;i++) step(params.dt / substeps);
    }

    for (let i = markerData.length - 1; i >= 0; i--) {
      markerData[i].time += dt;
      if (markerData[i].time > 1.5) {
        branchMarkers.remove(markerData[i].mesh);
        markerData[i].mesh.geometry.dispose();
        markerData[i].mesh.material.dispose();
        markerData.splice(i, 1);
      } else {
        markerData[i].mesh.material.opacity = 1.0 - (markerData[i].time / 1.5);
      }
    }

    frameCount++;
    if (tNow > lastFpsUpdate + 1000) {
      fps = frameCount; frameCount = 0; lastFpsUpdate = tNow;
    }
    const avgK = (lastMeanKappa / (arms.length||1)).toFixed(2);
    const avgDL = (lastMeanDL / (arms.length||1) / (params.dt || 0.016)).toExponential(2);
    hudEl.textContent = `FPS: ${fps} | E=${params.E_mag.toFixed(0)} V/m  |  avg|κ_tip|=${avgK}  |  growth≈${avgDL} m/s  |  branches=${arms.reduce((a,b)=>a+b.branches.length,0)}`;

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
